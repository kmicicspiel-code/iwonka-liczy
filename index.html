<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f6b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>IWONKA LICZY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Układ: jedna kolumna jak dzienniczek — podsumowanie dnia, potem posiłki; dodawanie w wysuwanym panelu od dołu */
:root{
  --bg:#f3f5ef; --card:#ffffff; --fg:#1d2419; --muted:#6a7363; --line:#dfe3d8;
  --accent:#3f6b2a; --accent-fg:#ffffff; --accent-soft:#e3ecd9;
  --prot:#3d6fb4; --carb:#c98a14; --fat:#c2486a; --warn:#c0392b;
  --shadow:0 1px 2px rgba(30,40,20,.06),0 4px 16px rgba(30,40,20,.06);
  --display:"Bricolage Grotesque","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141810; --card:#1d221a; --fg:#e8ede2; --muted:#9aa591; --line:#2e3529;
  --accent:#8fc06b; --accent-fg:#14200c; --accent-soft:#26331e;
  --prot:#7aa6e6; --carb:#e3ad48; --fat:#e57a98; --warn:#ff7a6b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141810; --card:#1d221a; --fg:#e8ede2; --muted:#9aa591; --line:#2e3529;
  --accent:#8fc06b; --accent-fg:#14200c; --accent-soft:#26331e;
  --prot:#7aa6e6; --carb:#e3ad48; --fat:#e57a98; --warn:#ff7a6b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg)}
body{margin:0;-webkit-tap-highlight-color:transparent;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* nagłówek z datą */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav{display:flex;align-items:center;gap:4px}
.brand{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.14em;color:var(--accent);margin-bottom:-6px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:22px}
.iconbtn:hover{background:var(--accent-soft);color:var(--fg)}
.datelabel{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;min-width:0;text-align:center}
.datesub{font-size:12px;color:var(--muted);text-align:center;margin-top:-2px}
.goalbtn{font-size:13px;color:var(--muted);padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.goalbtn:hover{color:var(--fg)}

/* podsumowanie dnia */
.summary{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.kcalrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kcalbig{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em}
.kcalbig small{font-family:var(--body);font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.left{font-size:14px;color:var(--muted);text-align:right}
.left b{color:var(--fg);font-weight:600}
.left.over b{color:var(--warn)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.bar.over>i{background:var(--carb)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.macro{display:flex;flex-direction:column;gap:6px;min-width:0}
.macro .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.macro .val{font-weight:600;font-size:15px}
.macro .val span{color:var(--muted);font-weight:400;font-size:13px}
.macro .bar{height:6px}
.m-b .bar>i{background:var(--prot)} .m-w .bar>i{background:var(--carb)} .m-t .bar>i{background:var(--fat)}

/* baner przykładu */
.note{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.note button{font-weight:600;color:var(--accent);padding:4px 0}

/* posiłki */
.meal{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.mealhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.mealname{font-family:var(--display);font-weight:600;font-size:18px}
.mealsum{font-size:13px;color:var(--muted);text-align:right}
.mealsum b{color:var(--fg);font-size:15px;font-weight:600}
.entries{list-style:none;margin:0;padding:0}
.entry{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.entry:hover{background:var(--accent-soft)}
.entry .nm{flex:1;min-width:0}
.entry .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .mx{font-size:12px;color:var(--muted)}
.entry .mx em{font-style:normal}
.entry .kc{font-weight:600;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px 1px 6px;vertical-align:middle}
.dot.b{background:var(--prot);margin-left:0}.dot.w{background:var(--carb)}.dot.t{background:var(--fat)}
.addbtn{width:100%;padding:12px 16px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;text-align:left;display:flex;align-items:center;gap:8px}
.addbtn:hover{background:var(--accent-soft)}
.addbtn span{font-size:20px;line-height:1}

/* wysuwany panel */
.scrim{position:fixed;inset:0;background:rgba(10,15,8,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;
  max-height:88%;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.2);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:10px auto 6px;flex:none}
.secrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:-4px}
.secrow .sec{margin:0}
.secrow button{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 10px;flex:none}
.sheethead h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;text-wrap:balance}
.sheetbody{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:12px;padding-bottom:4px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheetbody>*{flex-shrink:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=search]{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.results h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 4px;font-weight:600}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.res:hover{background:var(--accent-soft)}
.res .rn{min-width:0;flex:1}
.res .rs{font-size:12px;color:var(--muted)}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:6px;margin-left:6px;font-weight:600;vertical-align:2px}
.res .rk{font-size:13px;color:var(--muted);white-space:nowrap}
.scanbox{display:flex;gap:8px}
.scanbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;border:1.5px dashed var(--accent);color:var(--accent);font-weight:600}
.scanbtn svg{width:22px;height:22px}
.scanmsg{font-size:13px;color:var(--muted);margin:0}
.scanmsg.err{color:var(--warn)}
.code{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}
.scanner{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.scanner video{flex:1;width:100%;min-height:0;object-fit:cover}
.scanframe{position:absolute;left:50%;top:42%;width:min(78vw,340px);height:min(40vw,170px);transform:translate(-50%,-50%);border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scanframe::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#8fc06b;box-shadow:0 0 12px #8fc06b;animation:scanline 1.6s ease-in-out infinite}
@keyframes scanline{0%,100%{transform:translateY(-55px)}50%{transform:translateY(55px)}}
.scanbar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:10px;align-items:center;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#fff;text-align:center}
.scanbar p{margin:0;font-size:15px}
.scanbar .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.scanbar button{background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:11px 18px;font-weight:600;backdrop-filter:blur(6px)}
.lookup{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 0;color:var(--muted);text-align:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.src{font-size:12px;color:var(--muted);margin:0}
.backup{display:flex;gap:8px;flex-wrap:wrap}
.backup button,.backup label{flex:1;text-align:center;padding:11px;border-radius:12px;border:1px solid var(--line);font-weight:500;cursor:pointer}
.who{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:14px;max-width:46%;min-width:0}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:13px;flex:none}
.who .wn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.remain{display:flex;flex-direction:column;gap:2px}
.remain .rl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.remain .rv{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;letter-spacing:-.02em}
.remain .rv small{font-family:var(--body);font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0}
.remain.over .rv{color:var(--carb)}
.eaten{font-size:14px;color:var(--muted)}.eaten b{color:var(--fg);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:11px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sports{display:flex;flex-wrap:wrap;gap:8px}
.sports button{padding:8px 13px;border-radius:99px;border:1px solid var(--line);font-size:14px}
.sports button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input[type=date]{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.eer{background:var(--accent-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.eer .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
.eer .sub{font-size:13px;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--line);width:100%;text-align:left}
.prow[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.prow .pi{flex:1;min-width:0}.prow .ps{font-size:12px;color:var(--muted)}
.prow .ed{color:var(--accent);font-weight:600;font-size:14px;padding:6px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:6px 0 -4px}
.addrow{display:flex;gap:4px;flex-wrap:wrap}
.addrow .newprod{flex:1;min-width:150px}
.ings{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ings li+li{border-top:1px solid var(--line)}
.ing{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;width:100%;text-align:left}
.ing:hover{background:var(--accent-soft)}
.ing .in{min-width:0;flex:1}.ing .in div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ing .is{font-size:12px;color:var(--muted)}
.ings .empty{padding:14px 12px;font-size:14px;color:var(--muted)}
.ings .ringadd{width:100%;padding:12px;color:var(--accent);font-weight:600;text-align:left;border-top:1px solid var(--line)}
.ings li:first-child .ringadd{border-top:0}
.newprod{color:var(--accent);font-weight:600;padding:12px 4px;text-align:left}

/* etykieta wartości odżywczej */
.label{border:2px solid var(--fg);border-radius:10px;padding:10px 12px}
.label .lh{font-family:var(--display);font-weight:800;font-size:15px;border-bottom:6px solid var(--fg);padding-bottom:4px;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.label .lh span{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);align-self:end}
.label table{width:100%;border-collapse:collapse;font-size:14px}
.label td{padding:4px 0;border-bottom:1px solid var(--line)}
.label tr:last-child td{border-bottom:0}
.label td:nth-child(2),.label td:nth-child(3){text-align:right;width:28%}
.label td:nth-child(3){font-weight:600}
.label .first td{font-weight:600}
.gramrow{display:flex;gap:10px;align-items:stretch}
.gramrow input{font-size:26px;font-weight:600;text-align:center;flex:1;min-width:0}
.gramrow .unit{align-self:center;font-size:18px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-size:14px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.primary{width:100%;background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:15px;font-weight:600;font-size:16px}
.primary:disabled{opacity:.45;cursor:default}
.danger{width:100%;color:var(--warn);padding:12px;font-weight:600;border-radius:14px;border:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted)}
.empty{padding:2px 16px 12px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="scanner" id="scanner" hidden>
  <video id="scanvideo" playsinline muted></video>
  <div class="scanframe" aria-hidden="true"></div>
  <div class="scanbar"><p id="scantext">Nakieruj aparat na kod kreskowy</p>
    <div class="row"><button id="torchbtn" data-act="torch" hidden>Latarka</button><button data-act="scanphoto">Zrób zdjęcie</button><button data-act="scanclose">Anuluj</button></div></div>
</div>
<input type="file" id="scanfile" accept="image/*" capture="environment" hidden>
<input type="file" id="importfile" accept="application/json,.json" hidden>

const ACT=[["sed","Mało ruchu","głównie siedzi, mało zabawy na dworze"],["low","Lekko aktywny","codzienna zabawa, spacery, WF"],["act","Aktywny","do tego sport 2–5 godz. w tygodniu"],["very","Bardzo aktywny","sport ponad 5 godz. w tygodniu"]];

function ageOf(dob){if(!dob)return null;const b=new Date(dob),t=new Date();let a=t.getFullYear()-b.getFullYear();
  const m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate()))a--;
  const months=(t.getFullYear()-b.getFullYear())*12+t.getMonth()-b.getMonth()-(t.getDate()<b.getDate()?1:0);return{y:a,m:months}}
function suggestAct(hours){if(!(hours>0))return"low";if(hours<2)return"low";if(hours<=5)return"act";return"very"}
function eer(p){
  const ag=ageOf(p.dob),wt=p.weight,ht=(p.height||0)/100;if(!ag||!(wt>0)||!(ht>0)||!p.sex)return null;
  const i=["sed","low","act","very"].indexOf(p.activity||"low"),y=ag.y,M=p.sex==="m";
  if(ag.m<36)return Math.round(89*wt-100+20);
  if(y<19){const PA=(M?[1,1.13,1.26,1.42]:[1,1.16,1.31,1.56])[i];
    const base=M?88.5-61.9*y+PA*(26.7*wt+903*ht):135.3-30.8*y+PA*(10*wt+934*ht);return Math.round(base+(y<9?20:25))}
  const PA=(M?[1,1.11,1.25,1.48]:[1,1.12,1.27,1.45])[i];
  return Math.round(M?662-9.53*y+PA*(15.91*wt+539.6*ht):354-6.91*y+PA*(9.36*wt+726*ht));
}
const macroGoals=k=>({k,b:Math.round(k*.15/4),w:Math.round(k*.55/4),t:Math.round(k*.30/9)});

const day=()=>{const p=P();p.days=p.days||{};return p.days[dkey(cur)]||(p.days[dkey(cur)]={})};
const calc=e=>({k:e.k*e.g/100,b:e.b*e.g/100,w:e.w*e.g/100,t:e.t*e.g/100});
const sum=list=>list.reduce((a,e)=>{const c=calc(e);a.k+=c.k;a.b+=c.b;a.w+=c.w;a.t+=c.t;return a},{k:0,b:0,w:0,t:0});

function dateLabel(){
  const k=dkey(cur),t=new Date();const y=new Date();y.setDate(t.getDate()-1);const tm=new Date();tm.setDate(t.getDate()+1);
  const full=cur.toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"});
  if(k===dkey(t))return["Dziś",full];if(k===dkey(y))return["Wczoraj",full];if(k===dkey(tm))return["Jutro",full];
  return[cur.toLocaleDateString("pl-PL",{day:"numeric",month:"short"}),cur.toLocaleDateString("pl-PL",{weekday:"long",year:"numeric"})];
}

function recipeTotals(r){
  const t=r.ing.reduce((a,i)=>{a.g+=i.g;a.k+=i.k*i.g/100;a.b+=i.b*i.g/100;a.w+=i.w*i.g/100;a.t+=i.t*i.g/100;return a},{g:0,k:0,b:0,w:0,t:0});

}

let draft=null,delArm=false;
function profileSummary(p){const a=ageOf(p.dob);const bits=[];if(a)bits.push(a.y<3?`${a.m} mies.`:`${a.y} l.`);
  if(p.weight)bits.push(`${String(p.weight).replace(".",",")} kg`);if(p.height)bits.push(`${p.height} cm`);bits.push(`${p.goals.k} kcal`);return bits.join(" · ")}
function showProfiles(){
  ctx={mode:"profiles"};
  openSheet(head("Osoby")+`<div class="sheetbody"><ul class="plist">${state.profiles.map(p=>`<li><div class="prow" aria-current="${p.id===state.cur}">
    <button class="pi" data-act="switchp" data-pid="${p.id}" style="text-align:left"><div style="font-weight:600">${esc(p.name)}</div><div class="ps num">${profileSummary(p)}</div></button>
    <button class="ed" data-act="editp" data-pid="${p.id}">Zmień dane</button></div></li>`).join("")}</ul>
    <button class="newprod" data-act="addp">+ Dodaj osobę</button>
    <div class="field"><label>Kopia zapasowa (wszystkie osoby, wpisy i twoje produkty)</label>
      <div class="backup"><button data-act="export">Zapisz do pliku</button><label for="importfile">Wczytaj z pliku</label></div>
      <p class="hint" style="margin:0">Przydaje się przy zmianie telefonu. Wczytanie pliku zastępuje obecne dane.</p></div></div>`);
}
function showProfile(p,first){
  draft=p?JSON.parse(JSON.stringify({...p,days:undefined})):{id:"p"+uid(),name:"",sex:"",dob:"",weight:"",height:"",sports:[],hours:"",activity:"",goals:{k:0},kcalManual:false};
  draft.isNew=!p;delArm=false;ctx={mode:"profile"};
  const today10=today();
  openSheet((first?`<div class="sheethead"><h2>Dla kogo liczymy?</h2></div>`:head(p?"Dane osoby":"Nowa osoba"))+`<div class="sheetbody">
    <div class="field"><label for="p-name">Imię</label><input type="text" id="p-name" value="${esc(draft.name)}" placeholder="np. Olek"></div>
    <div class="field"><label>Płeć</label><div class="seg"><button data-act="sex" data-v="m" aria-pressed="${draft.sex==="m"}">Chłopiec / mężczyzna</button><button data-act="sex" data-v="k" aria-pressed="${draft.sex==="k"}">Dziewczynka / kobieta</button></div></div>
    <div class="field"><label for="p-dob">Data urodzenia</label><input type="date" id="p-dob" max="${today10}" value="${esc(draft.dob||"")}"></div>
    <div class="grid4">
      <div class="field"><label for="p-weight">Waga (kg)</label><input type="text" id="p-weight" inputmode="decimal" value="${draft.weight?String(draft.weight).replace(".",","):""}" placeholder="np. 22,5"></div>
      <div class="field"><label for="p-height">Wzrost (cm)</label><input type="text" id="p-height" inputmode="decimal" value="${draft.height||""}" placeholder="np. 120"></div>
    </div>
    <div class="sec">Sporty</div>
    <div class="sports" id="p-sports">${SPORTS.map(x=>`<button data-act="sport" data-v="${esc(x)}" aria-pressed="${(draft.sports||[]).includes(x)}">${esc(x)}</button>`).join("")}</div>
    <div class="field"><label for="p-other">Inne sporty (wpisz po przecinku)</label><input type="text" id="p-other" value="${esc((draft.sports||[]).filter(x=>!SPORTS.includes(x)).join(", "))}" placeholder="np. judo, jazda konna"></div>
    <div class="field"><label for="p-hours">Ile godzin sportu w tygodniu (razem, bez WF)</label><input type="text" id="p-hours" inputmode="decimal" value="${draft.hours||""}" placeholder="np. 3"></div>
    <div class="field"><label for="p-act">Ogólna aktywność</label><select id="p-act">${ACT.map(([v,l,d])=>`<option value="${v}" ${(draft.activity||"low")===v?"selected":""}>${l} — ${d}</option>`).join("")}</select></div>
    <div class="eer" id="p-eer"></div>
    <div class="field"><label for="p-kcal">Dzienny cel (kcal) — możesz zmienić ręcznie</label><input type="text" id="p-kcal" inputmode="numeric" value="${draft.goals&&draft.goals.k||""}"></div>
    <p class="hint" style="margin:0">Wyliczenie według norm zapotrzebowania (IOM) dla wieku, wagi, wzrostu i aktywności. U dziecka to orientacyjna ilość energii na wzrost i sport, nie limit do odchudzania. Jeśli chodzi o nadwagę albo niedowagę, cel lepiej ustalić z pediatrą lub dietetykiem.</p>
    <button class="primary" data-act="savep">${first||!p?"Zapisz i zaczynamy":"Zapisz"}</button>
    <p class="hint" id="p-err" style="margin:0;color:var(--warn)"></p>
    ${p&&state.profiles.length>1?`<button class="danger" data-act="delp" id="delp">Usuń tę osobę</button>`:""}</div>`, first?"p-name":null);
  if(first)sheet.querySelector(".grab").remove();
  updEER(true);
}
function readDraft(){
  draft.name=document.getElementById("p-name").value.trim();
  draft.dob=document.getElementById("p-dob").value;
  draft.weight=num(document.getElementById("p-weight").value)||"";
  draft.height=num(document.getElementById("p-height").value)||"";
  draft.hours=num(document.getElementById("p-hours").value)||"";
  draft.activity=document.getElementById("p-act").value;
  const other=document.getElementById("p-other").value.split(",").map(x=>x.trim()).filter(Boolean);
  draft.sports=[...draft.sports.filter(x=>SPORTS.includes(x)),...other];
}
function updEER(init){
  readDraft();
  const e=eer(draft),box=document.getElementById("p-eer"),kc=document.getElementById("p-kcal");
  if(!e){box.innerHTML=`<div class="sub">Uzupełnij płeć, datę urodzenia, wagę i wzrost, a policzę dzienne zapotrzebowanie.</div>`;return}
  const a=ageOf(draft.dob),m=macroGoals(e);
  box.innerHTML=`<div class="sub">Szacowane zapotrzebowanie${a?` (${a.y<3?a.m+" mies.":a.y+" l."})`:""}</div><div class="big num">${e} kcal / dzień</div>
    <div class="sub num">białko ok. ${m.b} g · węglowodany ok. ${m.w} g · tłuszcz ok. ${m.t} g</div>`;
  if(!draft.kcalManual&&(!init||!kc.value))kc.value=e;
}
function addRecent(id){state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,20)}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b){if(ev.target===scrim&&state.profiles.length)back();return}
  const a=b.dataset.act;
  if(a==="prev"||a==="next"){cur=new Date(cur);cur.setDate(cur.getDate()+(a==="prev"?-1:1));render()}
  else if(a==="close")back();
  else if(a==="add")showSearch(b.dataset.meal);
  else if(a==="newprod")showNewProduct(ctx.meal);
  else if(a==="pick"){const p=products().find(x=>x.id===b.dataset.pid);if(p)showAmount(p,ctx.meal)}
  else if(a==="newrecipe")newRecipe();
  else if(a==="redit"){const p=state.custom.find(x=>x.id===b.dataset.pid);if(p)editRecipe(p)}
  else if(a==="ringadd"){readRecipe();showSearch(null)}
  else if(a==="rback")showRecipe();
  else if(a==="ringedit"){readRecipe();const i=rd.ing[+b.dataset.i];if(i)showAmount(i,null,i)}
  else if(a==="rsave")saveRecipe();
  else if(a==="rdel"){if(!rdArm){rdArm=true;b.textContent="Na pewno? Kliknij jeszcze raz";return}
    state.custom=state.custom.filter(x=>x.id!==rd.id);state.recent=state.recent.filter(x=>x!==rd.id);save();rd=null;closeSheet();render()}
  else if(a==="cunit"){ctx.u=b.dataset.v;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    document.getElementById("c-per").textContent="na 100 "+ctx.u}
  else if(a==="chip"){document.getElementById("grams").value=b.dataset.g;updLabel()}
  else if(a==="edit"){const e=(day()[b.dataset.meal]||[]).find(x=>x.id===b.dataset.id);if(e)showAmount({n:e.n,k:e.k,b:e.b,w:e.w,t:e.t,u:e.u,rec:!!e.pw,pw:e.pw},b.dataset.meal,e)}
  else if(a==="saveentry"){
    const g=num(document.getElementById("grams").value);if(!(g>0))return;
    const{p,meal,entry,forRecipe}=ctx;
    if(forRecipe){if(entry)entry.g=g;else rd.ing.push({n:p.n,g,k:p.k,b:p.b,w:p.w,t:p.t,u:U(p)});if(!entry&&p.id)addRecent(p.id);save();
      if(entry||b.dataset.done)showRecipe();else showSearch(null);return}
    if(entry)entry.g=g;
    else{const d=day(),en={id:uid(),n:p.n,g,k:p.k,b:p.b,w:p.w,t:p.t,u:U(p)};if(p.rec)en.pw=p.pw;(d[meal]||(d[meal]=[])).push(en);if(p.id)addRecent(p.id)}
    save();closeSheet();render();
  }
  else if(a==="delentry"&&ctx.forRecipe){rd.ing=rd.ing.filter(x=>x!==ctx.entry);showRecipe()}
  else if(a==="delentry"){const d=day();d[ctx.meal]=(d[ctx.meal]||[]).filter(x=>x!==ctx.entry);save();closeSheet();render()}
  else if(a==="savenew"){
    const v=id=>num(document.getElementById(id).value);
    const n=document.getElementById("c-name").value.trim();
    const pb=v("c-b")||0,pw=v("c-w")||0,pt=v("c-t")||0;let k=v("c-k");
    if(!(k>=0))k=Math.round(pb*4+pw*4+pt*9);
    const err=document.getElementById("c-err");
    if(!n){err.textContent="Wpisz nazwę produktu.";return}
    if(!(k>0)){err.textContent="Podaj kalorie albo chociaż białko, węgle lub tłuszcz.";return}
    const p={id:"c"+uid(),n,k,b:pb,w:pw,t:pt,u:ctx.u||"g"};if(ctx.ean)p.ean=ctx.ean;state.custom.push(p);save();showAmount(p,ctx.meal);
  }
  else if(a==="profiles")showProfiles();
  else if(a==="switchp"){state.cur=b.dataset.pid;save();closeSheet();render()}
  else if(a==="editp"){const p=state.profiles.find(x=>x.id===b.dataset.pid);if(p)showProfile(p)}
  else if(a==="addp")showProfile(null);
  else if(a==="sex"){draft.sex=b.dataset.v;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));updEER()}
  else if(a==="sport"){const v=b.dataset.v,on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);
    draft.sports=on?[...draft.sports,v]:draft.sports.filter(x=>x!==v);
    const h=document.getElementById("p-hours");if(on&&!h.value)h.focus();updEER()}
  else if(a==="savep"){
    readDraft();const err=document.getElementById("p-err");
    if(!draft.name){err.textContent="Wpisz imię.";return}
    let k=Math.round(num(document.getElementById("p-kcal").value));if(!(k>0))k=eer(draft);
    if(!(k>0)){err.textContent="Uzupełnij dane do wyliczenia albo wpisz cel kalorii ręcznie.";return}
    const old=state.profiles.find(x=>x.id===draft.id);const isNew=draft.isNew;delete draft.isNew;
    const rec={...draft,goals:macroGoals(k),days:old?old.days:{}};
    if(old)state.profiles[state.profiles.indexOf(old)]=rec;else state.profiles.push(rec);
    if(isNew)state.cur=rec.id;save();closeSheet();render();
  }
  else if(a==="delp"){
    if(!delArm){delArm=true;b.textContent="Na pewno? Kliknij jeszcze raz — usunie też wpisy tej osoby";return}
    state.profiles=state.profiles.filter(x=>x.id!==draft.id);if(state.cur===draft.id)state.cur=state.profiles[0].id;save();closeSheet();render();
  }
  else if(a==="clearex"){state.days={};state.example=false;save();render()}
  else if(a==="scan")startScan();
  else if(a==="scanclose")stopScan();
  else if(a==="scanphoto"){stopScan();document.getElementById("scanfile").click()}
  else if(a==="torch")toggleTorch();
  else if(a==="lookup")handleCode(b.dataset.code);
  else if(a==="export"){
    const blob=new Blob([JSON.stringify(state)],{type:"application/json"});const u=URL.createObjectURL(blob);
    const l=document.createElement("a");l.href=u;l.download="iwonka-liczy-kopia-"+today()+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
  }
});
/* ---- skaner kodów ---- */
let zx=null,stream=null,scanning=false,track=null,torchOn=false;
function loadZXing(){return zx||(zx=new Promise((ok,no)=>{const sc=document.createElement("script");
  sc.src="zxing.min.js";sc.onload=()=>ok(window.ZXing);sc.onerror=no;document.head.appendChild(sc)}))}
const FORMATS=["ean_13","ean_8","upc_a","upc_e"];
async function nativeDetector(){
  if(!("BarcodeDetector" in window))return null;
  try{const sup=await BarcodeDetector.getSupportedFormats();const f=FORMATS.filter(x=>sup.includes(x));
    return f.length?new BarcodeDetector({formats:f}):null}catch(e){return null}
}
function zxDecodeCanvas(Z,canvas){
  try{const hints=new Map();hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
    hints.set(Z.DecodeHintType.TRY_HARDER,true);
    const r=new Z.MultiFormatReader();r.setHints(hints);
    const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(canvas)));
    return r.decode(bmp).getText()}catch(e){return null}
}
async function startScan(){
  const ov=document.getElementById("scanner"),v=document.getElementById("scanvideo");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById("scanfile").click();return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){document.getElementById("scanfile").click();return}
  ov.hidden=false;v.srcObject=stream;try{await v.play()}catch(e){}
  track=stream.getVideoTracks()[0];torchOn=false;
  try{const caps=track.getCapabilities?track.getCapabilities():{};document.getElementById("torchbtn").hidden=!caps.torch}catch(e){}
  try{const caps=track.getCapabilities();if(caps.focusMode&&caps.focusMode.includes("continuous"))track.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}
  scanning=true;
  const det=await nativeDetector();const Z=det?null:await loadZXing().catch(()=>null);
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  let last=null,hits=0;
  const tick=async()=>{
    if(!scanning)return;
    let code=null;
    if(v.readyState>=2){
      if(det){try{const r=await det.detect(v);if(r.length)code=r[0].rawValue}catch(e){}}
      else if(Z){const w=v.videoWidth,h=v.videoHeight,cw=Math.round(w*.8),ch=Math.round(h*.45);
        cv.width=cw;cv.height=ch;cx.drawImage(v,(w-cw)/2,(h-ch)/2,cw,ch,0,0,cw,ch);code=zxDecodeCanvas(Z,cv)}
    }
    if(code){if(code===last)hits++;else{last=code;hits=1}
      if(hits>=2||det){try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}stopScan();handleCode(code);return}}
    setTimeout(tick,det?120:200);
  };
  tick();
}
function stopScan(){scanning=false;document.getElementById("scanner").hidden=true;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}track=null}
async function toggleTorch(){if(!track)return;torchOn=!torchOn;try{await track.applyConstraints({advanced:[{torch:torchOn}]})}catch(e){}}
async function decodeFile(file){
  const det=await nativeDetector();
  if(det){try{const r=await det.detect(await createImageBitmap(file));if(r.length)return r[0].rawValue}catch(e){}}
  const Z=await loadZXing();const img=await createImageBitmap(file);
  const sc=Math.min(1,1600/Math.max(img.width,img.height));const cv=document.createElement("canvas");
  cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  return zxDecodeCanvas(Z,cv);
}
async function onPhoto(file){
  if(sheet.hidden)return;
  openSheet(head("Czytam kod…")+`<div class="sheetbody"><div class="lookup"><div class="spin"></div></div></div>`);
  let code=null;try{code=await decodeFile(file)}catch(e){}
  if(code)handleCode(code);
  else{showSearch(ctx.meal);const m=document.getElementById("scanmsg");m.hidden=false;m.className="scanmsg err";
    m.textContent="Nie udało się odczytać kodu ze zdjęcia. Spróbuj bliżej i ostrzej albo wpisz numer spod kreskówki w wyszukiwarkę."}
}

/* ---- baza Open Food Facts ---- */
const n1=v=>{const x=parseFloat(v);return isFinite(x)?Math.round(x*10)/10:null};
async function fetchOFF(code){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),9000);
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_pl,generic_name_pl,brands,quantity,nutrition_data_per,nutriments&lc=pl`,{signal:ctl.signal});
    if(r.status===404)return{found:false};
    if(!r.ok)throw new Error("http");
    const j=await r.json();if(j.status!==1||!j.product)return{found:false};
    const p=j.product,nu=p.nutriments||{};
    let name=(p.product_name_pl||p.product_name||p.generic_name_pl||"").trim();
    const brand=(p.brands||"").split(",")[0].trim();
    if(brand&&name&&!norm(name).includes(norm(brand)))name+=` (${brand})`;
    let k=n1(nu["energy-kcal_100g"]);if(k==null&&nu["energy-kj_100g"]!=null)k=Math.round(nu["energy-kj_100g"]/4.184);
    if(k==null&&nu["energy_100g"]!=null)k=Math.round(nu["energy_100g"]/4.184);
    const b=n1(nu.proteins_100g),w=n1(nu.carbohydrates_100g),t=n1(nu.fat_100g);
    const u=/\d\s*(ml|cl|l)\b/i.test(p.quantity||"")?"ml":"g";
    return{found:true,name,k,b,w,t,u,complete:k!=null&&b!=null&&w!=null&&t!=null}
  }finally{clearTimeout(to)}
}
async function handleCode(code){
  const meal=ctx.meal;
  const mine=state.custom.find(x=>x.ean===code);
  if(mine){showAmount(mine,meal);return}
  openSheet(head("Szukam produktu…")+`<div class="sheetbody"><div class="lookup"><div class="spin"></div><span>Kod <span class="code">${esc(code)}</span></span></div></div>`);
  ctx={mode:"lookup",meal};
  let res=null;
  try{res=await fetchOFF(code)}catch(e){showNewProduct(meal,code,"","Brak internetu albo baza produktów nie odpowiada.");return}
  if(ctx.mode!=="lookup")return;
  if(!res.found){showNewProduct(meal,code,"","Tego kodu nie ma w bazie produktów.");return}
  if(!res.complete){showNewProduct(meal,code,res.name,"Baza zna ten produkt, ale bez pełnych wartości odżywczych.");
    if(res.u==="ml"){const mb=document.querySelector('#c-unit [data-v="ml"]');if(mb)mb.click()}
    const set=(id,v)=>{if(v!=null)document.getElementById(id).value=String(v).replace(".",",")};
    set("c-k",res.k);set("c-b",res.b);set("c-w",res.w);set("c-t",res.t);return}
  const p={id:"c"+uid(),n:res.name||("Produkt "+code),k:res.k,b:res.b,w:res.w,t:res.t,u:res.u,ean:code,src:"off"};
  state.custom.push(p);save();
  showAmount(p,meal,null,"Dane z bazy Open Food Facts. Warto raz porównać z etykietą.");
}
document.addEventListener("change",ev=>{
  if(ev.target.id==="p-act"||ev.target.id==="p-dob")updEER();
  if(ev.target.id==="scanfile"&&ev.target.files[0]){onPhoto(ev.target.files[0]);ev.target.value=""}
  if(ev.target.id==="importfile"&&ev.target.files[0]){
    const f=ev.target.files[0];ev.target.value="";
    f.text().then(t=>{const d=JSON.parse(t);if(!d||!(d.profiles||d.days))throw 0;localStorage.setItem(KEY,t);location.reload()})
      .catch(()=>{const h=document.querySelector("#sheet .hint:last-child");if(h){h.textContent="To nie jest plik kopii z tej aplikacji.";h.style.color="var(--warn)"}});
  }
});
document.addEventListener("input",ev=>{
  if(ctx.mode==="recipe"&&["r-por","r-tw"].includes(ev.target.id))updRecipeSum();
  if(ev.target.id==="p-kcal"&&draft)draft.kcalManual=!!ev.target.value;
  if(ctx.mode==="profile"&&["p-dob","p-weight","p-height","p-hours","p-act","p-name","p-other"].includes(ev.target.id)){
    if(ev.target.id==="p-hours"){const h=num(ev.target.value);if(h>=0)document.getElementById("p-act").value=suggestAct(h)}
    updEER()}
  if(ev.target.id==="q")fillResults(ev.target.value);
  if(ev.target.id==="grams")updLabel();
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"){if(scanning)stopScan();else if(!sheet.hidden&&state.profiles.length)back()}
  if(ev.key==="Enter"&&ev.target.id==="q"){const dq=ev.target.value.trim().replace(/\s/g,"");if(/^\d{8,14}$/.test(dq))handleCode(dq)}
  if(ev.key==="Enter"&&ev.target.id==="grams")document.getElementById("save").click();
});
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
